<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules of Survival: Unbound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { padding: 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2833; }
        .logo { font-weight: 800; font-size: 1.25rem; color: #66fcf1; letter-spacing: 2px; text-transform: uppercase; }
        .hero { max-width: 800px; margin: 0 auto; padding: 6rem 2rem 4rem; text-align: center; }
        h1 { font-size: 3rem; color: #fff; margin-bottom: 1rem; font-weight: 900; letter-spacing: -1px; }
        p { font-size: 1.1rem; line-height: 1.6; color: #8892b0; margin-bottom: 2.5rem; }
        .btn-group { display: flex; gap: 1rem; justify-content: center; }
        .btn { background: #66fcf1; color: #0b0c10; padding: 0.75rem 2rem; border-radius: 4px; font-weight: 700; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: #45a29e; }
        .btn-secondary { background: transparent; color: #66fcf1; border: 1px solid #66fcf1; }
        .btn-secondary:hover { background: rgba(102, 252, 241, 0.1); }
        footer { padding: 2rem; text-align: center; font-size: 0.85rem; color: #45a29e; border-top: 1px solid #1f2833; }
    </style>
</head>
<body>
    <header>
        <div class="logo">ROS: Unbound</div>
        <div style="font-size: 0.9rem; color: #45a29e;">Offline Project</div>
    </header>

    <div class="hero">
        <h1>SURVIVE THE ISLAND AGAIN</h1>
        <p>An offline preservation and standalone project reviving the classic battle royale experience. No servers required, just drop in and play.</p>
        <div class="btn-group">
            <a href="#download" class="btn">Download Build</a>
            <a href="https://discord.gg" target="_blank" class="btn btn-secondary">Discord Community</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ROS: Unbound Project. Community-driven preservation.</p>
    </footer>
</body>
</html>
